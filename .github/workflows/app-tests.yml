# Frontend quality gate: strict typecheck + lint on every PR, plus the
# /api/push fail-closed contract test (T0.4). The dummy NEXT_PUBLIC_* values
# only satisfy module-scope client creation during build — no page fetches
# data at build time (every page is "use client").
name: app-tests

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/test_scoring_ui.cjs"
      - "scripts/tests/signup-flow.cjs"
      - "scripts/tests/personal-submission-status.cjs"
      - "scripts/tests/unified-flow.cjs"
      - "scripts/tests/card-autosave-offline.cjs"
      - "scripts/tests/app-presentation.cjs"
      - "scripts/tests/mobile-push.cjs"
      - "scripts/tests/card-flow.cjs"
      - "public/sw.js"
      - "public/offline.html"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/app-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/test_scoring_ui.cjs"
      - "scripts/tests/signup-flow.cjs"
      - "scripts/tests/personal-submission-status.cjs"
      - "scripts/tests/unified-flow.cjs"
      - "scripts/tests/card-autosave-offline.cjs"
      - "scripts/tests/app-presentation.cjs"
      - "scripts/tests/mobile-push.cjs"
      - "scripts/tests/card-flow.cjs"
      - "public/sw.js"
      - "public/offline.html"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/app-tests.yml"

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
      - run: node scripts/test_scoring_ui.cjs
      - run: node --test scripts/tests/signup-flow.cjs
      - run: node --test scripts/tests/personal-submission-status.cjs
      - run: node --test scripts/tests/unified-flow.cjs
      - run: node --test scripts/tests/card-autosave-offline.cjs
      - run: node --test scripts/tests/app-presentation.cjs
      - run: node --test scripts/tests/mobile-push.cjs
      - run: node --test scripts/tests/card-flow.cjs
      # Locale parity + no undefined t() keys. Both fail silently at runtime:
      # a key missing from fr shows English to French users, and a key missing
      # from both renders the raw key ("games.create.title") on the page.
      - run: python3 scripts/check_i18n.py --check
      - run: bash scripts/test_apple_gate.sh

  push-route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next build
      - run: bash scripts/test_push_route.sh
